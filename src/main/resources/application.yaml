spring:
  application:
    name: admin-panel
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: booking_user
    password: booking_pass
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

app:
  jwt:
    # Override with JWT_SECRET env var in production (min 32 chars)
    secret: ${JWT_SECRET:dev-only-secret-change-in-production-min-32-chars}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - http://localhost:5173
  storage:
    # Choose from: 'local', 's3', or 'gcs'
    provider: ${STORAGE_PROVIDER:local}
    cdn-base-url: ${STORAGE_CDN_BASE_URL:}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:us-east-1}
    gcs:
      bucket: ${GCS_BUCKET:}
