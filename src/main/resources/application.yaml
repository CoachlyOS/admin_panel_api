spring:
  application:
    name: admin-panel
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: booking_user
    password: booking_pass
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    # Override with JWT_SECRET env var in production (min 32 chars)
    secret: ${JWT_SECRET:dev-only-secret-change-in-production-min-32-chars}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - http://localhost:5173
